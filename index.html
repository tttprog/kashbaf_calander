        </h1>
        <p class="text-2xl mt-3 opacity-80">

        </p>
      </div>

      <!-- Date Boxes -->
      <div class="grid grid-cols-3 gap-6 p-8">

        <!-- شمسی -->
        <div class="bg-green-50 border-4 border-green-500 rounded-2xl p-6 text-center">

          <h2 class="text-green-700 text-3xl font-bold mb-5">

          </div>

        </div>

        <div class="bg-blue-50 border-4 border-blue-500 rounded-2xl p-6 text-center">

            🌍 میلادی
          </h2>

          <div class="text-4xl font-black flex flex-col justify-around gap-5" id="gregorian">

          </div>

        </div>

        <div class="bg-yellow-50 border-4 border-yellow-500 rounded-2xl p-6 text-center">

          <h2 class="text-yellow-700 text-3xl font-bold mb-5">
            ☪ هجری
          </h2>

          <div class="text-4xl font-black flex flex-col justify-around gap-5" id="hijri">

          </div>

        </div>

      </div>

      <!-- Event -->
      <div class="mx-8 bg-red-50 border-4 border-red-500 rounded-2xl p-6">

        <div class="flex items-start gap-3">
          <h2 class="text-red-700 text-4xl font-black mb-5">
            📌 رویدادهای امروز
          </h2>

        </div>

        <ul class="space-y-4 text-3xl font-semibold" id="events">
        </ul>

      </div>

      <!-- Prayer Times -->
      <div class="mx-8 mt-8 bg-indigo-50 border-4 border-indigo-500 rounded-2xl p-6">

        <h2 class="text-indigo-700 text-4xl font-black mb-6">
          🕌 اوقات شرعی
        </h2>

        <div class="grid grid-cols-3 gap-6">

          <div class="bg-white rounded-xl shadow p-6 text-center">

            <div class="text-3xl font-bold text-gray-600">
              اذان صبح
            </div>

            <div class="text-5xl font-black mt-4" id="fajr">

            </div>

          </div>

          <div class="bg-white rounded-xl shadow p-6 text-center">

            <div class="text-3xl font-bold text-gray-600">
              اذان ظهر
            </div>

            <div class="text-5xl font-black mt-4" id="dhuhr">

            </div>

          </div>

          <div class="bg-white rounded-xl shadow p-6 text-center">

            <div class="text-3xl font-bold text-gray-600">
              اذان مغرب
            </div>

            <div class="text-5xl font-black mt-4" id="maghrib">

            </div>

          </div>

        </div>

      </div>

      <!-- Spacer -->
      <div class="flex"></div>

      <!-- Footer -->
      <div
        class="bg-gradient-to-r from-gray-900 to-gray-800 text-white h-96 px-10 flex items-center justify-between mt-10">

    async function downloadImage() {
      await document.fonts.ready;
      await Promise.all(
        Array.from(document.images).map(img => {
          if (img.complete) return Promise.resolve();
          return new Promise(resolve => {
            img.onload = img.onerror = resolve;
          });
        })
      );


      const element = document.getElementById("canvas");

      const canvas = await html2canvas(element, {
        scale: 3,
        useCORS: true,
        backgroundColor: "#ffffff",
        // width: 1080,
        // height: 1350,
        windowWidth: 1080,
        windowHeight: 1350,
      });

      const link = document.createElement("a");
      link.download = "calendar-post.png";
      link.href = canvas.toDataURL("image/png");
      link.click();
    }

    async function loadCalendar() {
      const dlbtn = document.getElementById("dlbtn")
      dlbtn.disabled = true;
      dlbtn.textContent = "درحال دریافت اطلاعات"
      const url =
        "https://api.aladhan.com/v1/timingsByCity?city=Tehran&country=Iran&method=7";

      const response = await fetch(url);
      const json = await response.json();

      const data = json.data;

      // events
      const today_g = new Date();

      const formatted = today_g.toISOString().split("T")[0];
      const todayEvent = data_365.find(
        item => item.gregorian_date === formatted
      );
      const eventsEl = document.getElementById("events");

      // رویدادهای موجود در data_365 + رویدادهای کامل تقویم رسمی ۱۴۰۵
      const events = todayEvent
        ? [...new Set([
            ...(todayEvent.events || []),
            ...(officialEvents[todayEvent.solar_date] || []),
            ...(officialEventsExtra[todayEvent.solar_date] || [])
          ])]
        : [];

      if (events.length > 0) {
        eventsEl.innerHTML = events.map(event => `<li>${event}</li>`).join("");
      } else {
        eventsEl.innerHTML = "<li>رویدادی برای این روز ثبت نشده است.</li>";
      }
      // if (todayEvent?.is_holiday) {
      //   is_holiday.textContent = "تعطیل رسمی";
      // } else {
      //   is_holiday.textContent = "امروز تعطیل نیست.";
      // }
      // اوقات شرعی
      document.getElementById("fajr").textContent =
        data.timings.Fajr.substring(0, 5);

      document.getElementById("dhuhr").textContent =
        data.timings.Dhuhr.substring(0, 5);

      document.getElementById("maghrib").textContent =
        data.timings.Maghrib.substring(0, 5);

      // تاریخ میلادی
      document.getElementById("gregorian").innerHTML =
        `<span>${data.date.gregorian.day}</span>  <span>${data.date.gregorian.month.en}</span>  <span>${data.date.gregorian.year}</span>`;

      // تاریخ هجری
      document.getElementById("hijri").innerHTML =
        `<span>${data.date.hijri.day}</span> <span>${data.date.hijri.month.ar}</span> <span>${data.date.hijri.year}</span>`;

      // تاریخ شمسی (جلالی)
      const today = new Date();

      const weekday = new Intl.DateTimeFormat("fa-IR-u-ca-persian", {
        weekday: "long",
      }).format(today);

      const day = new Intl.DateTimeFormat("fa-IR-u-ca-persian", {
        day: "numeric",
      }).format(today);

      const month = new Intl.DateTimeFormat("fa-IR-u-ca-persian", {
        month: "long",
      }).format(today);

      const year = new Intl.DateTimeFormat("fa-IR-u-ca-persian", {
        year: "numeric",
      }).format(today);

      const persianDate = `<span>${weekday}</span> <span> ${day} ${month}</span> <span>${year}</span>`;

      document.getElementById("shamsi").innerHTML = persianDate;
      dlbtn.disabled = false;
      dlbtn.textContent = "دانلود"
    }



    loadCalendar();
  </script>
